name: Koha OPAC AI Assistant — CI

on:
  push:
    branches: [ main, "feature/**", "release/**" ]
  pull_request:
    branches: [ main ]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Python — lint, tests
  # -----------------------------------------------------------------------
  python-ci:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Lint — syntax errors and undefined names (strict)
        run: |
          flake8 backend/app \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Lint — style warnings (non-blocking)
        run: |
          flake8 backend/app \
            --count \
            --exit-zero \
            --max-complexity=12 \
            --max-line-length=127 \
            --statistics

      - name: Validate metadata.json
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("metadata.json") as f:
              m = json.load(f)
          required = ["name", "author", "canonicalname", "description", "minimum_version", "version"]
          missing = [k for k in required if not m.get(k)]
          if missing:
              print(f"ERROR: metadata.json missing fields: {missing}", file=sys.stderr)
              sys.exit(1)
          if not m["canonicalname"].startswith("Koha::Plugin::"):
              print(f"ERROR: invalid canonicalname: {m['canonicalname']}", file=sys.stderr)
              sys.exit(1)
          print(f"metadata.json OK — version {m['version']}, canonical: {m['canonicalname']}")
          EOF

      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE
          export PYTHONPATH=$GITHUB_WORKSPACE/backend:$PYTHONPATH
          pytest tests/ -v --tb=short \
            --ignore=tests/test_api.py \
            2>&1 | tee test_output.txt || true
          # test_api.py requires a live database — skip in CI

      - name: Run plugin tests specifically
        run: |
          bash scripts/build.sh
          pytest tests/test_plugin.py -v --tb=short

  # -----------------------------------------------------------------------
  # Job 2: Perl — syntax check
  # -----------------------------------------------------------------------
  perl-syntax:
    name: Perl Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Perl
        run: sudo apt-get install -y perl

      - name: Check OPACChatBot.pm syntax
        run: |
          perl -c Koha/Plugin/OPACChatBot.pm 2>&1 | tee perl_check.txt || true
          # Koha modules won't be installed on CI — only fail on real syntax errors
          if grep -v "Can't locate\|syntax OK" perl_check.txt | grep -qi "error"; then
            echo "Perl syntax errors found!"
            cat perl_check.txt
            exit 1
          fi
          echo "Perl syntax check passed (Koha runtime modules not required on CI)"

      - name: Verify package declaration
        run: |
          grep -q "^package Koha::Plugin::OPACChatBot;" Koha/Plugin/OPACChatBot.pm \
            && echo "package declaration OK" \
            || (echo "ERROR: package declaration missing or wrong" && exit 1)

      - name: Verify lifecycle hooks
        run: |
          for hook in new install upgrade uninstall opac_head opac_js; do
            grep -q "^sub ${hook}" Koha/Plugin/OPACChatBot.pm \
              && echo "  Found: sub ${hook}" \
              || echo "  WARNING: sub ${hook} not found"
          done

  # -----------------------------------------------------------------------
  # Job 3: Build — create and verify KPZ
  # -----------------------------------------------------------------------
  build-kpz:
    name: Build KPZ Package
    runs-on: ubuntu-latest
    needs: [ python-ci, perl-syntax ]

    steps:
      - uses: actions/checkout@v4

      - name: Install zip/unzip
        run: sudo apt-get install -y zip unzip

      - name: Build KPZ
        run: bash scripts/build.sh

      - name: Verify KPZ contents
        run: |
          echo "=== Archive contents ==="
          unzip -l KohaOPACAIAssistant-v2.kpz

          echo "=== Checking required entries ==="
          unzip -l KohaOPACAIAssistant-v2.kpz | grep -q "metadata.json"          && echo "OK: metadata.json"
          unzip -l KohaOPACAIAssistant-v2.kpz | grep -q "Koha/Plugin/OPACChatBot.pm" && echo "OK: OPACChatBot.pm"
          unzip -l KohaOPACAIAssistant-v2.kpz | grep -q "css/"                   && echo "OK: css/"
          unzip -l KohaOPACAIAssistant-v2.kpz | grep -q "js/"                    && echo "OK: js/"

          echo "=== Checking no Windows paths ==="
          unzip -l KohaOPACAIAssistant-v2.kpz | grep -v '\\' && echo "OK: no backslash paths"

          echo "=== Checking canonicalname in archive ==="
          CANONICAL=$(unzip -p KohaOPACAIAssistant-v2.kpz metadata.json | python3 -c "import sys,json; print(json.load(sys.stdin)['canonicalname'])")
          [ "${CANONICAL}" = "Koha::Plugin::OPACChatBot" ] && echo "OK: canonicalname=${CANONICAL}"

      - name: Upload KPZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: KohaOPACAIAssistant-v2-${{ github.sha }}
          path: KohaOPACAIAssistant-v2.kpz
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 4: GitHub Deployment Status (for the Environments sidebar widget)
  # -----------------------------------------------------------------------
  github-deployment:
    name: Create GitHub Deployment
    runs-on: ubuntu-latest
    needs: [ build-kpz ]
    permissions:
      deployments: write
    if: github.ref == 'refs/heads/main' # Only create deployments for the main branch

    steps:
      - name: Start Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Finish Deployment
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: Production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          # The "View deployment" button will point to the repository's releases page
          env_url: "https://github.com/${{ github.repository }}/releases"
